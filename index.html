<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>WebGPU Ocean</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --panel: rgba(12, 16, 24, 0.66); --text: #e8ecf2; --dim: #9aa6b8; --accent: #ffb26b; --line: rgba(255,255,255,0.1); }
  html, body { margin: 0; height: 100%; background: #07090d; color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
               overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .glass { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); }

  #gear { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); width: 40px; height: 40px;
          border-radius: 50%; color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; padding: 0; display: grid; place-items: center; transition: transform .25s; }
  #gear[aria-expanded="true"] { transform: rotate(60deg); }
  #camModes { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(60px + env(safe-area-inset-right)); display: flex; gap: 6px; }
  #camModes button { height: 40px; padding: 0 12px; border-radius: 20px; color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  #camModes button[aria-pressed="true"] { background: rgba(255,178,107,0.42); border-color: rgba(255,178,107,0.7); }
  #camModes button:disabled { opacity: .4; cursor: default; }
  #fps { position: fixed; top: calc(22px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); color: var(--dim); font-variant-numeric: tabular-nums;
         text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; }

  #panel { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); width: 260px; max-height: calc(100dvh - 140px);
           overflow-y: auto; padding: 10px 12px; border-radius: 12px; transition: opacity .2s, transform .2s; }
  #panel.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  #panel h2 { font-size: 11px; margin: 8px 0 2px; font-weight: 600; color: var(--dim); letter-spacing: .06em; }
  #panel h2:first-child { margin-top: 0; }
  label { display: grid; grid-template-columns: 74px 1fr 40px; align-items: center; gap: 6px; margin: 4px 0; color: var(--dim); }
  output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label.check input { justify-self: start; width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .quality { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .quality output { text-align: right; color: var(--accent); font-weight: 600; }
  #weather { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 6px; }
  #weather button { padding: 6px 0; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  #weather button[aria-pressed="true"] { background: rgba(255,178,107,0.42); border-color: rgba(255,178,107,0.7); }
  .boatrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 2px; color: var(--dim); font-size: 12px; min-height: 28px; }
  #respawn { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  #respawn:active { background: rgba(255,178,107,0.35); }
  .version { color: var(--dim); font-size: 11px; text-align: right; margin-top: 6px; }
  #reset { width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06);
           color: var(--text); font: inherit; cursor: pointer; }
  #reset:hover { background: rgba(255,178,107,0.2); }
  #reset:active { background: rgba(255,178,107,0.35); }
  .scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin: -2px 0 0 80px; padding-right: 46px; }

  #helmHud { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom)); padding: 6px 14px; border-radius: 16px;
             font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 1; }
  #helmHud[hidden] { display: none; }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; color: var(--dim); }
  #help b { color: var(--text); font-weight: 600; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 15px; color: var(--dim); }
  #status.error { color: #ff8a8a; pointer-events: auto; padding: 24px; text-align: center; line-height: 1.7; }

  /* touch controls (shown only on touch devices) */
  #touch { display: none; }
  .touch #touch { display: block; }
  .touch #help { display: none; }
  .driving #help { display: none; }
  #stick { position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 120px; height: 120px;
           border-radius: 50%; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
          background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.35); }
  #updown { position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  #updown button { width: 56px; height: 56px; border-radius: 50%; color: var(--text); font-size: 18px; touch-action: none; }
  #updown button.on, #gear:active { background: rgba(255,178,107,0.35); }
  @media (max-width: 600px) { #panel { width: auto; left: calc(12px + env(safe-area-inset-left)); } }
</style>
</head>
<body>
<canvas id="gfx"></canvas>
<div id="status">海を準備中…</div>
<span id="fps"></span>
<div id="camModes">
  <button id="camLock" class="glass" aria-pressed="false" title="カメラを船に向けたままにする (L)">🎯 ロック</button>
  <button id="camFollow" class="glass" aria-pressed="false" title="同じ高度のまま船について行く (F)">🚁 追従</button>
  <button id="camDrive" class="glass" aria-pressed="false" title="船を操縦する: W/S スロットル, A/D 舵 (B)">⛵ 操縦</button>
</div>
<button id="gear" class="glass" aria-label="設定" aria-expanded="false" aria-controls="panel">⚙️</button>
<div id="panel" class="glass hidden">
  <div class="quality">
    <label>画質 <input type="range" id="quality" min="0" max="4" step="1"><output id="qualityName"></output></label>
    <div class="scale"><span>ライト</span><span>最高</span></div>
  </div>
  <h2>海</h2>
  <label>風速 m/s <input type="range" data-key="windSpeed" min="2" max="22" step="0.5"><output></output></label>
  <label>風向 °   <input type="range" data-key="windAngle" min="0" max="360" step="1"><output></output></label>
  <label>波の鋭さ <input type="range" data-key="choppy" min="0" max="2" step="0.05"><output></output></label>
  <label>波の高さ ×  <input type="range" data-key="waveHeight" min="0.3" max="3" step="0.05"><output></output></label>
  <label>白波     <input type="range" data-key="foam" min="0" max="3" step="0.05"><output></output></label>
  <h2>船</h2>
  <label class="check">表示 <input type="checkbox" id="boat"><span></span></label>
  <label>重さ t   <input type="range" data-key="boatMass" min="1" max="12" step="0.1"><output></output></label>
  <label>速度 kn  <input type="range" data-key="boatSpeed" min="0" max="10" step="0.5"><output></output></label>
  <div class="boatrow"><span id="boatStatus"></span><button id="respawn" type="button">船を戻す</button></div>
  <h2>空と天気</h2>
  <div id="weather" role="group" aria-label="天気">
    <button type="button" data-weather="clear">☀️ 晴れ</button><button type="button" data-weather="rain">🌧 雨</button><button type="button" data-weather="storm">⛈ 雷雨</button><button type="button" data-weather="snow">❄️ 雪</button>
  </div>
  <label>時刻     <input type="range" data-key="hour" data-format="hour" min="0" max="24" step="0.05"><output></output></label>
  <label>時の流れ <input type="range" data-key="timeFlow" data-format="flow" min="0" max="4" step="1"><output></output></label>
  <label>月齢     <input type="range" data-key="moonAge" data-format="moon" min="0" max="29.5" step="0.5"><output></output></label>
  <label>雲量     <input type="range" data-key="clouds" min="0" max="1" step="0.01"><output></output></label>
  <h2>表示</h2>
  <label>露出     <input type="range" data-key="exposure" min="0.2" max="8" step="0.05"><output></output></label>
  <label>ブルーム <input type="range" data-key="bloom" min="0" max="0.3" step="0.01"><output></output></label>
  <label>時間速度 <input type="range" data-key="timeScale" min="0" max="3" step="0.05"><output></output></label>
  <button id="reset" type="button">↺ デフォルトに戻す</button>
  <div class="version">v7 · 昼夜と天気</div>
</div>
<div id="helmHud" class="glass" hidden></div>
<div id="help" class="glass"><b>WASD</b> 移動 · <b>Space/E</b> 上昇 · <b>Q/C</b> 下降 · <b>Shift</b> 加速 · <b>ドラッグ</b> 視点 · <b>ダブルクリック</b> マウスロック · <b>ホイール</b> 速度 · <b>L</b> ロック · <b>F</b> 追従 (ドラッグで回り込み・W/S で距離) · <b>B</b> 操縦 (W/S スロットル・A/D 舵) · <b>Esc</b> 解除 · <b>H</b> 設定</div>
<div id="touch">
  <div id="stick" class="glass" aria-label="移動"><div id="knob"></div></div>
  <div id="updown">
    <button class="glass" data-v="1" aria-label="上昇">▲</button>
    <button class="glass" data-v="-1" aria-label="下降">▼</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
